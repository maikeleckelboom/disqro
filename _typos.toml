[files]
extend-exclude = ["/.local/", "/target/", "/docs/evidence/", "/vendor/gpui-base-0.10.0/", "Cargo.lock"]
[default]
locale = "en-us"
extend-ignore-re = [
    'timebase\.numer',                     # Symphonia field
    'NIN_(KEY)?SELECT',                    # Win32 notification constants
    'b"trak"',                             # ISO media box
    "Controllin' The Universe|Dominatin",   # published recording titles
    '\bPNGs\b',
]
[default.extend-words]
lod = "lod"
cancelled = "canceled"
cancelling = "canceling"
