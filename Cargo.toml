[package]
name = "disqro"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native local music player for Windows"

[dependencies]
gpui-kit = "=0.10.0"
kira = { version = "=0.12.6", default-features = false, features = ["cpal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-channel = "2"
tempfile = "3"

symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "isomp4", "aac", "alac", "aiff", "id3v2", "ogg", "vorbis"] }
symphonia-adapter-libopus = "=0.3.0"
encoding_rs = "0.8"
lofty = "=0.25.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
