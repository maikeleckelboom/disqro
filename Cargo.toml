[package]
name = "disqro"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native local music player for Windows"

[dependencies]
async-lock = "3.5"
hashlink = "0.12"
gpui-kit = "=0.10.0"
kira = { version = "=0.12.6", default-features = false, features = ["cpal"] }
rtrb = "=0.4.1"
realfft = "3.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
async-channel = "2"
tempfile = "3"
fastrand = "2"
raw-window-handle = "0.6"

symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "isomp4", "aac", "alac", "aiff", "id3v2", "ogg", "vorbis"] }
symphonia-adapter-libopus = "=0.3.0"
encoding_rs = "0.8"
lofty = "=0.25.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
