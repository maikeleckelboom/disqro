[package]
name = "disqro"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native local music player for Windows"

[features]
qualification = [
    "gpui-windows-gpu/frame-statistics",
    "gpui-kit/profiler",
    "waveform-native/qualification",
]

[dependencies]
# Waveform Native: analysis, evidence, Stroke projection, the D3D11 renderer
# and GPUI surfaces. The same pinned revision supplies the GPUI platform
# patch below (docs/waveform-native.md).
waveform-native = { git = "https://github.com/maikeleckelboom/waveform-native", rev = "0e0202e2f34b99370ed952f7ad7d6999d134e81d", features = ["gpui"] }
async-lock = "3.5"
hashlink = "0.12"
gpui-kit = { version = "=0.10.0", features = ["gpui-fast"] }
kira = { version = "=0.12.6", default-features = false, features = ["cpal"] }
rtrb = "=0.4.1"
realfft = "3.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
async-channel = "2"
tempfile = "3"
fastrand = "2"
raw-window-handle = "0.6"

symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "isomp4", "aac", "alac", "aiff", "id3v2", "ogg", "vorbis"] }
symphonia-adapter-libopus = "=0.3.0"
encoding_rs = "0.8"
lofty = "=0.25.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
chrono = "=0.4.45"

[target.'cfg(windows)'.dependencies]
gpui-windows-gpu = { package = "gpui-fast-windows", version = "=0.1.17" }
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Cargo applies patches only from the root workspace. Waveform Native carries
# the single copy of GPUI's same-device texture bridge.
[patch.crates-io]
gpui-fast-windows = { git = "https://github.com/maikeleckelboom/waveform-native", rev = "0e0202e2f34b99370ed952f7ad7d6999d134e81d" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
